name: Deploy trigger worker

# Deploys workers/deploy-trigger — the Cloudflare Cron Trigger that fires
# deploy-cloudflare.yml right after each NYT rollover — and stores its
# GitHub token. Needs the DEPLOY_TRIGGER_TOKEN repository secret: a
# fine-grained PAT for this repo with "Actions: Read and write".

on:
  push:
    branches:
      - main
    paths:
      - "workers/deploy-trigger/**"
      - ".github/workflows/deploy-trigger-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      WRANGLER: npx --yes wrangler@4.64.0
      CONFIG: workers/deploy-trigger/wrangler.jsonc
    steps:
      - name: Check for the dispatch token
        id: token
        run: |
          if [ -z "$DEPLOY_TRIGGER_TOKEN" ]; then
            echo "::warning::DEPLOY_TRIGGER_TOKEN secret is not set — skipping. See docs/daily-freshness-plan.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.ready == 'true'
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Deploy worker
        if: steps.token.outputs.ready == 'true'
        run: $WRANGLER deploy --config "$CONFIG"

      - name: Store the GitHub token as a worker secret
        if: steps.token.outputs.ready == 'true'
        run: printf '%s' "$DEPLOY_TRIGGER_TOKEN" | $WRANGLER secret put GITHUB_TOKEN --config "$CONFIG"
