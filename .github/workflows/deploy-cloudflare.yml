name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  # The on-time daily deploys come from workers/deploy-trigger (Cloudflare
  # Cron Trigger → workflow_dispatch) at 00:05 and 03:05 ET. GitHub's own
  # schedule is often hours late, so it only stays as a fallback:
  # 08:30 UTC = 4:30 AM EDT / 3:30 AM EST, after both NYT rollovers.
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://wordlehint.info
      NEXT_PUBLIC_GOOGLE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ID }}
      NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
      NEXT_PUBLIC_BAIDU_TONGJI: ${{ secrets.NEXT_PUBLIC_BAIDU_TONGJI }}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
      NEXT_PUBLIC_PLAUSIBLE_SRC: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SRC }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        run: |
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      # Pin Node instead of taking whatever the runner image ships: ubuntu-latest
      # is moving to Ubuntu 26 and already hands out Node 22 or newer. Plain
      # shell rather than actions/setup-node — this workflow avoids external
      # actions. If nodejs.org is unreachable, warn and keep the runner's Node
      # so the daily deploy still goes out.
      - name: Setup Node.js
        run: |
          NODE_MAJOR=22
          cd "$RUNNER_TEMP"
          base="https://nodejs.org/dist/latest-v${NODE_MAJOR}.x"
          if curl -fsSL --retry 3 -o SHASUMS256.txt "$base/SHASUMS256.txt" \
            && tarball=$(grep -oE "node-v[0-9.]+-linux-x64\.tar\.xz" SHASUMS256.txt | head -1) \
            && curl -fsSL --retry 3 -o "$tarball" "$base/$tarball" \
            && grep " ${tarball}\$" SHASUMS256.txt | sha256sum -c --quiet -; then
            mkdir -p node
            tar -xJf "$tarball" -C node --strip-components=1
            echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::Could not download Node ${NODE_MAJOR}; using the runner's $(node --version)"
          fi

      - name: Setup pnpm
        run: |
          node --version
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Wordle data
        run: pnpm run update:wordle

      - name: Update Connections data
        run: pnpm run update:connections
        continue-on-error: true

      - name: Update Strands data
        run: pnpm run update:strands
        continue-on-error: true

      - name: Update Spelling Bee data
        run: pnpm run update:spelling-bee
        continue-on-error: true

      - name: Update Pips data
        run: pnpm run update:pips
        continue-on-error: true

      - name: Fetch definitions for new answers
        run: node scripts/generate-definitions.mjs

      - name: Fetch Spelling Bee word definitions
        run: node scripts/generate-bee-definitions.mjs
        continue-on-error: true

      - name: Commit updated data
        # Pushes HEAD to main, so only from runs of main itself.
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wordle-daily.json data/wordle-definitions.json data/connections-daily.json data/strands-daily.json data/spelling-bee-daily.json data/spelling-bee-definitions.json data/pips-daily.json
          git diff --staged --quiet || git commit -m "chore: update daily puzzle data"
          # Checkout step uses `git checkout FETCH_HEAD` (detached HEAD), so an
          # argless `git push` fails with "not currently on a branch". Push the
          # current HEAD explicitly to main.
          git push origin HEAD:main

      - name: Build with OpenNext
        run: pnpm exec opennextjs-cloudflare build

      # data/ holds tomorrow's prefetched puzzles; fail before deploying if
      # any rendered page or client chunk mentions an unreleased date.
      - name: Check for unreleased puzzle leaks
        run: node scripts/check-future-leak.mjs

      # Prerendered pages ship as Workers static assets (open-next.config.ts),
      # uploaded in a few batched requests. Cloudflare's API still has the odd
      # 5xx; the deploy is idempotent and assets already uploaded are kept,
      # so a retry resumes rather than starting over.
      - name: Deploy with OpenNext
        run: |
          for attempt in 1 2 3; do
            pnpm exec opennextjs-cloudflare deploy && exit 0
            echo "Deploy attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1
